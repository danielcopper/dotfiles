# SteamOS ships no system toolchain — /usr/include does not exist, so clangd
# cannot find libc headers. Mirror zig's own include search list (zig via mise
# is this machine's C compiler; list obtained from `zig cc -xc -E -v -`, order
# matters). Version-pinned paths: bump alongside the zig version in the
# project mise.toml files.
CompileFlags:
  Add:
    - -isystem/home/deck/.local/share/mise/installs/zig/0.14.1/lib/include
    - -isystem/home/deck/.local/share/mise/installs/zig/0.14.1/lib/libc/include/x86_64-linux-gnu
    - -isystem/home/deck/.local/share/mise/installs/zig/0.14.1/lib/libc/include/generic-glibc
    - -isystem/home/deck/.local/share/mise/installs/zig/0.14.1/lib/libc/include/x86-linux-any
    - -isystem/home/deck/.local/share/mise/installs/zig/0.14.1/lib/libc/include/any-linux-any
