# The browser, Steam, Discord and the terminal run in app.slice. Without
# protection the kernel swaps them out once Claude sessions and their test runs
# fill the RAM, and the next click waits for pages to come back from the disk
# swapfile. Below MemoryLow their memory is reclaimed only when nothing
# unprotected is left, so claude.slice gives way first.
# The protection holds only if every ancestor (user.slice, user-1000.slice,
# user@1000.service) carries at least the sum of what its children claim. Those
# three are set with root, as the dotfiles README describes under "Memory
# protection on the Steam Deck"; without them this value is worth nothing.
# 3G is a starting point: app.slice held 1.6G resident beside 7.4G swapped out
# when the desktop stalled on 2026-10-14.
[Slice]
MemoryLow=3G
