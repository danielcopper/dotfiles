# Plasma and KWin run in session.slice. Without protection the kernel swaps
# them out like any other cgroup once Claude sessions and their tests fill the
# RAM, and every window switch then waits for them to come back in. Below
# MemoryLow their memory is reclaimed only when nothing unprotected is left.
# 1G covers what they hold in all, resident plus swapped (about 820M).
[Slice]
MemoryLow=1G
