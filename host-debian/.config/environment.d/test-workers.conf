# Test runs of the projects take fewer workers than there are threads, as on
# the Deck (its `claude` wrapper): several gates at once filled daniel's memory
# slice (homelab, docs/changelog.md, "Speicherschutz für die Dienste,
# Worker-Grenze für Testläufe"). pytest-xdist reads its variable for `-n auto`,
# Vitest its own for the worker pool. The user manager passes both to
# herdr-core and every session under it; an SSH login shell does not get them.
VITEST_MAX_WORKERS=6
PYTEST_XDIST_AUTO_NUM_WORKERS=6
