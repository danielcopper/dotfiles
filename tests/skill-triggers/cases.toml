# Prompts for run.py. Each [[case]] has:
#   name    letters, digits and _ (what --list prints and the command line takes)
#   prompt  sent verbatim as the run's only message; the run starts in an empty directory
#   fires   the skill that must be called, or "none" for no skill call at all (optional)
#   quiet   skills that must not be called (optional; one of fires and quiet is required)
# Skill names are the directory names under claude/.claude/skills. Every
# model-invoked skill must fire in one case and stay quiet in another; run.py
# refuses the file otherwise. Keep prompts generic: nothing from a real
# project, host or person.

# --- diagnose vs tdd ---------------------------------------------------------

[[case]]
name = "diagnose_fires_on_what_broke"
fires = "diagnose"
quiet = ["tdd"]
prompt = """
The orders page test started failing right after this change: it expects 20 rows and gets 19. What broke?

```diff
-module.exports = { listOrders };
+function pageOrders(db, page, size) {
+  const rows = db.query('SELECT * FROM orders ORDER BY created_at DESC');
+  const start = (page - 1) * size;
+  return rows.slice(start, start + size - 1);
+}
+
+module.exports = { listOrders, pageOrders };
```
"""

[[case]]
name = "diagnose_fires_on_slow_endpoint"
fires = "diagnose"
quiet = ["tdd", "prototype"]
prompt = """
Since yesterday's deploy the search endpoint takes about four seconds per request instead of 200 ms. Nothing in the search code changed. Help me find out why it got slow.
"""

[[case]]
name = "tdd_fires_on_test_first"
fires = "tdd"
quiet = ["diagnose"]
prompt = """
Let's build a slugify(title) function test-first: red, green, refactor. It should lowercase, turn runs of non-alphanumerics into a single dash and trim dashes at both ends.
"""

[[case]]
name = "tdd_fires_on_integration_tests"
fires = "tdd"
quiet = ["diagnose", "prototype"]
prompt = """
I want to add a rate limiter to our HTTP client and drive it with integration tests from the start: write the failing test first, then the code.
"""

[[case]]
name = "diagnose_and_tdd_quiet_on_feature"
quiet = ["diagnose", "tdd"]
prompt = """
Add a --verbose flag to this argument parser that sets the log level to DEBUG.

```python
def parse_args(argv):
    parser = argparse.ArgumentParser(prog="sync")
    parser.add_argument("source")
    parser.add_argument("target")
    return parser.parse_args(argv)
```
"""

# --- grill-me vs grill-with-docs vs prototype vs research --------------------

[[case]]
name = "grill_me_fires_on_plan"
fires = "grill-me"
quiet = ["grill-with-docs", "prototype", "research"]
prompt = """
Grill me on this plan before I start: I want to move the nightly backup job from cron to a systemd timer, keep the last seven archives locally and push every Sunday's archive to object storage. Poke holes in it.
"""

[[case]]
name = "grill_with_docs_fires_on_glossary_and_adrs"
fires = "grill-with-docs"
quiet = ["grill-me", "research"]
prompt = """
Stress-test this plan against our glossary and the decisions in our ADRs, and update the glossary as we settle terms: we want to call a customer's saved cart a "draft order" and let it expire after 30 days.
"""

[[case]]
name = "prototype_fires_on_state_model"
fires = "prototype"
quiet = ["grill-me", "research"]
prompt = """
I can't decide between two state models for the upload queue: one status enum, or separate flags for queued, running and failed. Talking about it isn't settling it. Build something throwaway so I can feel which one holds up.
"""

[[case]]
name = "prototype_fires_on_tui_look"
fires = "prototype"
quiet = ["grill-me", "grill-with-docs"]
prompt = """
Before we decide on the layout, show me what a terminal UI for the job list could look like: a list on the left, the selected job's log on the right. Something quick I can run and look at, not the real thing.
"""

[[case]]
name = "research_fires_on_vendor_question"
fires = "research"
quiet = ["grill-me", "prototype"]
prompt = """
Research how systemd timers with Persistent=true behave when the machine was off at the scheduled time, and whether RandomizedDelaySec still applies to the catch-up run. I want primary sources for each claim.
"""

[[case]]
name = "research_fires_on_german_request"
fires = "research"
quiet = ["grill-with-docs", "prototype"]
prompt = """
Recherchiere, ob GitHub Actions bei einem geplanten Workflow (schedule/cron) verpasste Läufe nachholt, wenn GitHub zu dem Zeitpunkt überlastet war. Mit Quellen bitte.
"""

[[case]]
name = "research_quiet_on_definition"
fires = "none"
quiet = ["research", "grill-me", "worktree", "handoff"]
prompt = """
In two sentences: what is the difference between git merge and git rebase?
"""

