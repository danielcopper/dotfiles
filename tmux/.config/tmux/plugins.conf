# TPM plugins, managed with tmux-plugin-panel (prefix + P): the panel adds and
# removes lines here and never touches tmux.conf, which sources this file and
# still declares tpm itself. Plugin options stay in tmux.conf.
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'hiroppy/tmux-agent-sidebar'
set -g @plugin 'danielcopper/tmux-plugin-panel'
# continuum loads last: it reads @resurrect-restore-script-path one second
# after it loads, and tmux.conf sets that option only once TPM has loaded every
# plugin. A plugin the panel adds lands below this line and eats into that
# second; move such a plugin above continuum.
set -g @plugin 'tmux-plugins/tmux-continuum'
