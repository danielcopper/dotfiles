# yaml-language-server: $schema=config.schema.yaml
command_alias_start_index: 200
keybindings:
  # root_table: C-Space
  prefix_table: "?"
title:
  style: align=centre,bold
  prefix: tmux
  prefix_style: fg=green,align=centre,bold
position:
  x: R
  y: P
custom_variables:
  - name: log_info
    value: "#[fg=green,italics] [info]#[default]#[italics]"
macros:
  - name: reload-config
    commands:
      - display "#{log_info} Loading config... "
      - source-file ~/.config/tmux/tmux.conf
      - display -p "\n\n... Press ENTER to continue"
  - name: restart-pane
    # A macro becomes a command alias through `set -gF`, which expands formats
    # when the plugin loads; ## keeps #{pane_current_path} for respawnp to
    # expand when the macro runs.
    commands:
      - display "#{log_info} Restarting pane"
      - 'respawnp -k -c "##{pane_current_path}"'
items:
  - name: Run
    key: space
    command: command-prompt
  - name: Last window
    key: tab
    command: last-window
  - name: Last pane
    key: "`"
    command: last-pane
  - name: Zoom pane
    key: z
    command: resizep -Z
  - name: Split horizontal
    key: "|"
    command: 'splitw -h -c "#{pane_current_path}"'
  - name: Split vertical
    key: "-"
    command: 'splitw -v -c "#{pane_current_path}"'
  - name: Agent sidebar
    key: a
    command: 'run-shell "~/.config/tmux/agent-sidebar-toggle.sh"'
  - name: Agent sidebars, all windows
    key: A
    command: 'run-shell "~/.config/tmux/agent-sidebar-toggle.sh all"'
  - name: Plugin panel
    key: P
    command:
      display-popup -E -w 80% -h 70% "$TMUX_PLUGIN_MANAGER_PATH/tmux-plugin-panel/scripts/panel.sh"
  - separator: true
  - name: +Windows
    key: w
    menu:
      - name: Choose
        key: w
        command: choose-tree -Zw
      - name: Previous
        key: p
        command: previous-window
      - name: Next
        key: n
        command: next-window
      - name: New
        key: c
        command: 'neww -c "#{pane_current_path}"'
      - name: Rename
        key: R
        command: 'command-prompt -I "#W" { renamew -- "%%" }'
      - separator: true
      - name: +Layout
        key: l
        menu:
          - name: Next
            key: l
            command: nextl
            transient: true
          - name: Tiled
            key: t
            command: selectl tiled
          - name: Horizontal
            key: h
            command: selectl even-horizontal
          - name: Vertical
            key: v
            command: selectl even-vertical
          - name: Horizontal main
            key: H
            command: selectl main-horizontal
          - name: Vertical main
            key: V
            command: selectl main-vertical
      - name: Rotate
        key: o
        command: rotatew
        transient: true
      - name: Rotate reverse
        key: O
        command: rotatew -D
        transient: true
      - separator: true
      - name: Kill
        key: X
        command: 'confirm -p "Kill window #W? (y/n)" killw'
  - name: +Panes
    key: p
    menu:
      - name: Choose
        key: p
        command: displayp -d 0
      - separator: true
      - name: Left
        key: h
        command: selectp -L
      - name: Down
        key: j
        command: selectp -D
      - name: Up
        key: k
        command: selectp -U
      - name: Right
        key: l
        command: selectp -R
      - separator: true
      - name: +Resize
        key: r
        menu:
          - name: Left
            key: h
            command: resizep -L
            transient: true
          - name: Down
            key: j
            command: resizep -D
            transient: true
          - name: Up
            key: k
            command: resizep -U
            transient: true
          - name: Right
            key: l
            command: resizep -R
            transient: true
          - name: Left more
            key: H
            command: resizep -L 10
            transient: true
          - name: Down more
            key: J
            command: resizep -D 10
            transient: true
          - name: Up more
            key: K
            command: resizep -U 10
            transient: true
          - name: Right more
            key: L
            command: resizep -R 10
            transient: true
      - name: Swap left
        key: H
        command: swapp -t "{left-of}"
      - name: Swap down
        key: J
        command: swapp -t "{down-of}"
      - name: Swap up
        key: K
        command: swapp -t "{up-of}"
      - name: Swap right
        key: L
        command: swapp -t "{right-of}"
      - name: Break
        key: "!"
        command: break-pane
      - separator: true
      - name: Mark
        key: m
        command: selectp -m
      - name: Unmark
        key: M
        command: selectp -M
      - name: Capture
        key: C
        command: capture-pane
      - name: Respawn pane
        key: R
        macro: restart-pane
      - name: Sync panes
        key: S
        command: "setw synchronize-panes"
      - name: Kill
        key: X
        command: 'confirm -p "Kill pane #P? (y/n)" killp'
  - name: +Sessions
    key: s
    menu:
      - name: Choose
        key: s
        command: choose-tree -Zs
      - name: New
        key: N
        command: new
      - name: Rename
        key: r
        command: 'command-prompt -I "#S" { rename-session -- "%%" }'
  - name: +Copy
    key: c
    menu:
      - name: Copy mode
        key: c
        command: copy-mode
      - name: Copy pane to buffer
        key: "y"
        # capture-pane stores the pane into tmux's internal buffer; system-clipboard
        # piping (was hard-coded clip.exe — WSL-only and broken on every other host)
        # belongs in a per-host @copy-cmd, tracked in the tmux entknoten task.
        command: "capture-pane -J \\; display-message \"pane → tmux buffer\""
      - separator: true
      - name: Choose buffer
        key: b
        command: choose-buffer -Z
      - name: Paste buffer
        key: p
        command: pasteb
      - name: List buffers
        key: "#"
        command: list-buffers
  - name: +Client
    key: C
    menu:
      - name: Choose
        key: c
        command: choose-client -Z
      - name: Last
        key: l
        command: switchc -l
      - name: Previous
        key: p
        command: switchc -p
      - name: Next
        key: n
        command: switchc -n
      - separator: true
      - name: Refresh
        key: R
        command: refresh
      - name: Detach
        key: D
        command: detach
      - name: Suspend
        key: Z
        command: suspendc
      - separator: true
      - name: Show messages
        key: "~"
        command: show-messages
      - name: Time
        key: t
        command: clock-mode
      - name: Customize
        key: ","
        command: customize-mode -Z
  - separator: true
  - name: Reload config
    key: r
    command: "source-file ~/.config/tmux/tmux.conf \\; display-message tmux-reloaded"
  - name: +Keys
    key: "?"
    command: list-keys -N
