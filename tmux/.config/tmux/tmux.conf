##### General #################################################################
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g allow-passthrough on
set -g escape-time 0
set -g focus-events on
set -g extended-keys always
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
# Synchronized output (DECSET 2026): let tmux flush redraws to the outer
# terminal atomically, so partial-repaint TUIs (e.g. Claude Code's fast
# renderer) don't tear/corrupt on scroll under tmux.
set -as terminal-features 'xterm*:sync'
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off          # switch instead of exit on last-window kill

##### Pane styling ############################################################
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
set -g window-style 'fg=colour245'
set -g window-active-style 'fg=colour255'

##### Prefix & navigation #####################################################
unbind C-b
unbind p
bind p previous-window
set -g prefix C-Space
bind C-Space send-prefix
set -g mouse on
setw -g mode-keys vi

# Splits/new windows
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane movement (Vim style)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Resize panes (Shift + hjkl)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

# Sessions: lowercase s = fzf fast-switch, uppercase S = choose-tree (X kills, r renames).
# Plain `fzf`, not `fzf-tmux` — nesting two popups collapses the inner.
bind s display-popup -E -w 60% -h 60% "tmux list-sessions -F '#S' | fzf --reverse --prompt='session: ' | xargs -r tmux switch-client -t"
bind S choose-tree -Zs
# sesh: smart picker (running sessions + zoxide dirs + sesh.toml configs).
# display-popup + plain fzf inside the helper (fzf-tmux would nest a popup).
bind T display-popup -E -w 80% -h 70% "~/.config/tmux/sesh-connect.sh"

##### Copy / paste ############################################################
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Y send -X copy-end-of-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

set -g set-clipboard on

##### Plugins #################################################################
# git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'alexwforsythe/tmux-which-key'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '7'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @wk_cfg_key_prefix_table '?'

##### Theme: Catppuccin Mocha #################################################
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_background 'none'
set -g @catppuccin_window_status_style 'none'

# Flat blocks — empty separators, lualine's section_separators = "" twin.
set -g @catppuccin_status_left_separator ' '
set -g @catppuccin_status_middle_separator ''
set -g @catppuccin_status_right_separator ''
set -g @catppuccin_status_connect_separator 'no'
set -g @catppuccin_application_text '#{pane_current_command}'
set -g @catppuccin_directory_text '#{b:pane_current_path}'
set -g @catppuccin_session_icon "   "
set -g @catppuccin_session_text '  #S '
set -g @catppuccin_battery_icon " #{l:#{@mybat_icon}} "
set -g @catppuccin_battery_text ' #{l:#{@mybat}}  '
set -g @catppuccin_date_time_icon " 󰃰 "
set -g @catppuccin_date_time_text ' %H:%M  '

set -g @catppuccin_status_battery_icon_bg "#{E:@thm_surface_0}"
set -g @catppuccin_status_battery_icon_fg "#{E:@thm_lavender}"
set -g @catppuccin_status_date_time_icon_bg "#{E:@thm_surface_0}"
set -g @catppuccin_status_date_time_icon_fg "#{E:@thm_sapphire}"

run '~/.config/tmux/plugins/tpm/tpm'

##### Statusline ##############################################################
set -g status-position top
# Redraw cadence = idle-repaint floor only. CPU/RAM/battery come from tmux user
# options (set by status-daemon.sh, fork-free) and are re-read on every event-driven
# redraw, so their on-screen freshness is NOT bound by this -- it's the daemon's
# 1s sample rate. status-interval only caps how stale the bar gets when the
# terminal is idle (no events). 2s is imperceptible for a CPU%/clock and halves
# idle wakeups (nice on a handheld). It no longer multiplies any per-redraw forks
# -- there are none left in the bar.
set -g status-interval 2
set -g status-left-length 100
set -g status-right-length 100

set -g window-status-format "#[bg=#313244,fg=#bac2de] #I #[fg=#f5e0dc]  #[fg=#cdd6f4]#{b:pane_current_path} #[fg=#f2cdcd]#(~/.config/tmux/process-icon.sh #{pane_current_command}) #[fg=#cdd6f4]#W #[default]"
set -g window-status-current-format "#[bg=#45475a,fg=#eba0ac,bold] #I #[fg=#f5e0dc,nobold]  #[fg=#cdd6f4]#{b:pane_current_path} #[fg=#f2cdcd]#(~/.config/tmux/process-icon.sh #{pane_current_command}) #[fg=#cdd6f4,bold]#W#{?window_zoomed_flag, (󰊓),} #[default]"

set -g status-left "#{E:@catppuccin_status_session} "
# Inline CPU — value from status-daemon.sh via @mycpu (no fork on redraw), styled to
# match the RAM block below. Catppuccin's cpu module is avoided on purpose: it
# wraps the text in #(cpu_fg_color.sh)/#(cpu_bg_color.sh), which fork the whole
# tmux-cpu machinery (~120ms each) every redraw. Seed only when empty so a reload
# keeps the last value instead of flashing the placeholder until the next sample.
if -F '#{==:#{@mycpu},}' "set -g @mycpu '--%'"
if -F '#{==:#{@myram},}' "set -g @myram '--%'"
if -F '#{==:#{@mybat},}' "set -g @mybat '--%'"
set -gF status-right "#[bg=default] #[bg=#{@thm_surface_0},fg=#{@thm_yellow}] 󰻠 "
# #{l:...} defers @mycpu to draw time — without it, -F bakes the value in at set
# time and the figure freezes (only changing on reload). Same trick as RAM below.
set -agF status-right "#[bg=#{@thm_surface_0},fg=#{@thm_fg}] #{l:#{@mycpu}}  "
# Inline RAM — value from status-daemon.sh via @myram (no fork on redraw).
set -agF status-right "#[bg=default] #[bg=#{@thm_surface_0},fg=#{@thm_green}] 󰘚 "
set -agF status-right "#[bg=#{@thm_surface_0},fg=#{@thm_fg}] #{l:#{@myram}}  "
set -agF status-right "#{E:@catppuccin_status_battery}"
set -agF status-right "#{E:@catppuccin_status_date_time}"

# CPU/RAM/battery are published by status-daemon.sh into @mycpu/@myram/@mybat
# (fork-free option lookups on redraw). tmux-cpu/tmux-battery stay loaded by tpm
# for their placeholders but are no longer referenced here, so they never fork on
# redraw. Continuum's periodic save is driven from the daemon (was: a per-redraw
# #(continuum_save.sh) fork appended to status-right).

# Status sampler: publishes @mycpu/@myram every 1s and @mybat every 30s (all
# fork-free option writes), and drives continuum's save every 60s — replacing the
# per-redraw shell forks. Self-replaces on reload, exits when the server dies.
run-shell -b "~/.config/tmux/status-daemon.sh 1"

##### Per-host overrides ######################################################
if-shell "test -f ~/.config/tmux/tmux.local.conf" "source-file ~/.config/tmux/tmux.local.conf"
