# WSL sets no XDG_CURRENT_DESKTOP, so no desktop's portal config applies and
# xdg-desktop-portal would pick backends by chance. The gtk backend serves the
# Settings portal, whose color-scheme (from gsettings, set to prefer-dark by
# install-dotfiles.sh) tells WSLg apps such as herdr to draw dark; the Secret
# portal stays with gnome-keyring.
[preferred]
default=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
