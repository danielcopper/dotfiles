# Claude Code sessions keep their scratchpad and task output under
# /var/tmp/claude-<uid> (CLAUDE_CODE_TMPDIR, set in the shared .bashrc) and
# never remove it. Clear what has not been read, written or had its metadata
# changed (chmod, rename) for 30 days: long enough for a paused session to come
# back to its files.
#
# No "!" after the type. SteamOS's own /var/tmp rule is "q! ... 30d", and the
# periodic clean (systemd-tmpfiles --clean, no --boot) skips every "!" line,
# so that rule never ages anything out. This one runs from the user's
# systemd-tmpfiles-clean.timer, which install-dotfiles.sh enables.
e /var/tmp/claude-%U - - - 30d
